<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>유아용 키오스크</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      background: #fafafa;
    }
    header {
      background: #f45b5b;
      color: #fff;
      padding: 15px;
      font-size: 24px;
      text-align: center;
    }
    .container {
      display: flex;
      flex-direction: row;
      height: calc(100vh - 60px);
    }
    .products {
      flex: 2;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      padding: 20px;
      overflow-y: auto;
    }
    .product {
      border: 1px solid #ccc;
      border-radius: 10px;
      background: #fff;
      padding: 10px;
      text-align: center;
      cursor: pointer;
    }
    .product img {
      width: 100px;
      height: 100px;
      object-fit: contain;
    }
    /* 가격 옆 쿠폰 이미지 */
    .price {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 5px;
      font-size: 14px;
    }
    .price img {
      height: 18px;
    }

    .cart {
      flex: 1;
      border-left: 2px solid #ddd;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: #fff;
    }
    .cart h2 {
      margin-top: 0;
      font-size: 20px;
    }
    .cart-list {
      flex: 1;
      overflow-y: auto;
      margin-bottom: 20px;
    }
    .cart-item {
      display: flex;
      align-items: center;
      margin-bottom: 10px;
    }
    .cart-item img {
      width: 40px;
      height: 40px;
      margin-right: 10px;
    }
    .cart-buttons {
      display: flex;
      gap: 10px;
    }
    button {
      flex: 1;
      padding: 15px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn-clear {
      background: #ddd;
    }
    .btn-pay {
      background: #4caf50;
      color: white;
    }
    /* 팝업 스타일 */
    .popup {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .popup-content {
      background: white;
      padding: 30px;
      border-radius: 15px;
      text-align: center;
      max-width: 400px;
    }
    .popup-content img {
      width: 150px;
      margin: 15px 0;
    }
    .popup-content button {
      margin-top: 15px;
      width: 100%;
      background: #f45b5b;
      color: white;
    }
    /* 결제방식 버튼 가로 정렬 */
    .payment-options {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
    }
    .payment-options button {
      flex: unset;
      width: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 10px;
    }
    .payment-options button img {
      width: 40px;
      height: 40px;
    }
  </style>
</head>
<body>
  <header>수도마트</header>
  <div class="container">
    <!-- 상품 영역 -->
    <div class="products" id="products">
      <div class="product" data-name="구운감자" data-price="1" data-img="./images/potato.jpg">
        <img src="./images/potato.jpg" alt="구운감자">
        <p>구운감자<br>쿠폰1장</p>
      </div>
      <div class="product" data-name="참쌀설병" data-price="1" data-img="images/ricesnak.jpg">
        <img src="./images/ricesnak.jpg" alt="참쌀설병">
        <p>참쌀설병<br>쿠폰1장</p>
      </div>
      <div class="product" data-name="스티커" data-price="3" data-img="./images/stiker.jpg">
        <img src="./images/stiker.jpg" alt="스티커">
        <p>스티커<br>쿠폰3장</p>
      </div>
      <div class="product" data-name="색칠공부" data-price="3" data-img="images/colorstudy.jpg">
        <img src="./images/colorstudy.jpg" alt="색칠공부">
        <p>색칠공부<br>쿠폰3장</p>
      </div>
      <div class="product" data-name="스티커북" data-price="3" data-img="images/stikerbook.jpg">
        <img src="./images/stikerbook.jpg" alt="스티커북">
        <p>스티커북<br>쿠폰3장</p>
      </div>
      <div class="product" data-name="비행기" data-price="1" data-img="images/airplain.jpg">
        <img src="./images/airplain.jpg" alt="비행기">
        <p>비행기<br>쿠폰1장</p>
      </div>
      <div class="product" data-name="뽑기" data-price="1" data-img="images/ppopgi.jpg">
        <img src="./images/ppopgi.jpg" alt="뽑기">
        <p>뽑기<br>쿠폰1장</p>
      </div>
      <div class="product" data-name="비누방울" data-price="1" data-img="images/bubble.jpg">
        <img src="./images/bubble.jpg" alt="비누방울">
        <p>비누방울<br>쿠폰1장</p>
      </div>
      <div class="product" data-name="탱탱볼" data-price="1" data-img="images/balls.jpg">
        <img src="./images/balls.jpg" alt="탱탱볼">
        <p>탱탱볼<br>쿠폰1장</p>
      </div>
      <div class="product" data-name="작은스티커" data-price="1" data-img="images/smallsticker.jpg">
        <img src="./images/smallsticker.jpg" alt="작은스티커">
        <p>작은스티커<br>쿠폰1장</p>
      </div>
      <div class="product" data-name="유아양말" data-price="1" data-img="images/socks.jpg">
        <img src="./images/socks.jpg" alt="유아양말">
        <p>유아양말<br>쿠폰1장</p>
      </div>
      <div class="product" data-name="미니카" data-price="1" data-img="images/minicar.jpg">
        <img src="./images/minicar.jpg" alt="미니카">
        <p>미니카<br>쿠폰1장</p>
      </div>
    </div>

    <!-- 장바구니 영역 -->
    <div class="cart">
      <h2>선택한 상품</h2>
      <div class="cart-list" id="cart-list"></div>
  <div id="total-coupons" 
       style="margin:10px 0; font-weight:bold; color:#f45b5b; font-size:18px;">
  </div>
  
  <div class="cart-buttons">
    <button class="btn-clear" onclick="clearCart()">전체삭제</button>
    <button class="btn-pay" onclick="openPaymentPopup()">결제하기</button>
  </div>
</div>

  <!-- 결제 방식 선택 팝업 -->
  <div class="popup" id="payment-popup">
    <div class="popup-content">
      <h2>결제 방식을 선택하세요</h2>
      <div class="payment-options">
        <button onclick="choosePayment('coupon')">
          <img src="./images/coupon.jpg" alt="쿠폰">
          쿠폰
        </button>
        <button onclick="choosePayment('card')">
          <img src="./images/card.jpg" alt="카드">
          카드
        </button>
      </div>
    </div>
  </div>

  <!-- 쿠폰 입력 팝업 -->
  <div class="popup" id="coupon-popup">
    <div class="popup-content">
      <h2>쿠폰을 넣어주세요</h2>
    <div id="popup-total-coupons" 
         style="margin:10px 0; font-weight:bold; color:#f45b5b;"></div>
    <img src="./images/coupon.jpg" alt="쿠폰을 넣어주세요">
    <button onclick="finishPurchase()">확인</button>
  </div>
</div>

  <!-- 카드 결제 팝업 -->
  <div class="popup" id="card-popup">
    <div class="popup-content">
      <h2>카드를 터치해주세요</h2>
      <img src="./images/card.jpg" alt="카드를 접촉해주세요">
      <button onclick="finishPurchase()">확인</button>
    </div>
  </div>

  <!-- 구매 완료 팝업 -->
  <div class="popup" id="complete-popup">
    <div class="popup-content">
      <h2>구매 완료!</h2>
      <button onclick="closePopup('complete-popup')">닫기</button>
    </div>
  </div>

  <script>
    const cart = {};

    // 상품 클릭 이벤트
    document.querySelectorAll('.product').forEach(item => {
      item.addEventListener('click', () => {
        const name = item.dataset.name;
        const price = parseInt(item.dataset.price);
        const img = item.dataset.img;

        if (!cart[name]) {
          cart[name] = { qty: 1, price: price, img: img };
        } else {
          cart[name].qty++;
        }
        renderCart();
      });
    });

function renderCart() {
  const cartList = document.getElementById('cart-list');
  const totalCoupons = document.getElementById('total-coupons');
  cartList.innerHTML = '';
  let total = 0;

  for (let name in cart) {
    const item = cart[name];
    const div = document.createElement('div');
    div.classList.add('cart-item');
    div.innerHTML = `
      <img src="${item.img}" alt="${name}">
      <span>${name} × ${item.qty}</span>
    `;
    cartList.appendChild(div);

    total += item.price * item.qty;
  }

  // 첫 화면 표시
  if (total > 0) {
    totalCoupons.textContent = `총 필요한 쿠폰: ${total}장`;
  } else {
    totalCoupons.textContent = '';
  }

  // 결제 팝업에서도 같이 표시하도록 업데이트
  const popupTotal = document.getElementById('popup-total-coupons');
  if (popupTotal) {
    popupTotal.textContent = total > 0 ? `총 ${total}장 필요` : '';
  }
}
    function clearCart() {
      for (let key in cart) delete cart[key];
      renderCart();
    }

    function openPaymentPopup() {
      if (Object.keys(cart).length === 0) {
        alert("상품을 선택하세요!");
        return;
      }
      document.getElementById('payment-popup').style.display = 'flex';
    }

    function choosePayment(method) {
      document.getElementById('payment-popup').style.display = 'none';
      if (method === 'coupon') {
        document.getElementById('coupon-popup').style.display = 'flex';
      } else if (method === 'card') {
        document.getElementById('card-popup').style.display = 'flex';
      }
    }

    function finishPurchase() {
      clearCart();
      document.getElementById('coupon-popup').style.display = 'none';
      document.getElementById('card-popup').style.display = 'none';
      document.getElementById('complete-popup').style.display = 'flex';
    }

    function closePopup(id) {
      document.getElementById(id).style.display = 'none';
    }
  </script>
</body>
</html>
